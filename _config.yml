# Configuração do StackRadar
# Elo Firme - https://elofirme.com.br

# Informações do Site
title: "StackRadar"
description: "Encontre ferramentas SaaS com comparativos claros, fontes verificáveis e sem enrolação."
url: "https://diegosouzafotografo-estrela.github.io"
baseurl: "/stackradar"

# Configuração de Idioma
lang: pt-BR
locale: pt-BR

# Autor
author:
  name: "Elo Firme"
  url: "https://elofirme.com.br"

# Build
markdown: kramdown
permalink: /:categories/:title/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# SEO
seo:
  type: "Website"
  title: "StackRadar - Melhores Ferramentas SaaS"
  description: "Encontre ferramentas SaaS com comparativos claros, fontes verificáveis e sem enrolação."
  image: "/brand/logos/primary/elofirme-logo-primary-orange.svg"

# Exclude
exclude:
  - node_modules
  - package.json
  - package-lock.json
  - README.md

# Collections
collections:
  posts:
    output: true
    permalink: /:categories/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Elo Firme"
