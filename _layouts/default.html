<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #FF6B35;
      --navy: #1A365D;
      --white: #FFFFFF;
      --gray-50: #F9FAFB;
      --gray-100: #F3F4F6;
      --gray-200: #E5E7EB;
      --gray-400: #9CA3AF;
      --gray-500: #6B7280;
      --gray-600: #4B5563;
      --gray-800: #1F2937;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: var(--gray-800);
      background-color: var(--white);
    }

    .site-header {
      position: sticky;
      top: 0;
      background: var(--white);
      border-bottom: 1px solid var(--gray-200);
      padding: 16px 24px;
      z-index: 100;
    }

    .site-header .container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .site-title {
      font-weight: 600;
      color: var(--navy);
      text-decoration: none;
      font-size: 1.1rem;
    }

    .site-title span {
      color: var(--orange);
    }

    .site-nav a {
      color: var(--gray-600);
      text-decoration: none;
      margin-left: 24px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .site-nav a:hover {
      color: var(--orange);
    }

    .site-footer {
      text-align: center;
      padding: 32px 24px;
      background: var(--gray-50);
      border-top: 1px solid var(--gray-200);
      margin-top: 64px;
    }

    .site-footer p {
      color: var(--gray-600);
      font-size: 0.9rem;
    }

    .site-footer strong {
      color: var(--orange);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="{{ '/' | relative_url }}" class="site-title">Stack<span>Radar</span></a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>A <strong>Garapa</strong> project · © {{ site.time | date: '%Y' }} Garapa. All rights reserved.</p>
  </footer>
</body>
</html>
