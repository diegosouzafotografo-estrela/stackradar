[build]
  publish = "_site"
  command = "bundle exec jekyll build --url https://stackradar.netlify.app --baseurl ''"

[build.environment]
  RUBY_VERSION = "2.7"

[[redirects]]
  from = "https://stackradar.elofirme.com.br/*"
  to = "https://stackradar.netlify.app/:splat"
  status = 301
  force = true
